<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الحضور والغياب - مدرسة قدري أبو حسين الثانوية العسكرية</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .school-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px solid #e2e8f0; text-align: center; }
        .school-logo-svg { width: 90px; height: 90px; flex-shrink: 0; }
        .school-info h1 { font-size: 19px; color: #0d2b45; margin-bottom: 6px; font-weight: bold; }
        .school-info p { font-size: 13px; color: #d4af37; font-weight: bold; background: #0d2b45; padding: 4px 12px; border-radius: 20px; display: inline-block; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; background: #e0e0e0; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; flex: 1; }
        .tab-btn.active { background: #0d2b45; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .control-panel { display: flex; gap: 15px; margin-bottom: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; flex-wrap: wrap; align-items: center; }
        .form-group { display: flex; gap: 10px; flex: 1; }
        .search-box { margin-bottom: 15px; }
        .search-input { width: 100%; padding: 12px; border: 2px solid #0d2b45; border-radius: 6px; font-size: 15px; outline: none; }
        input[type="text"], input[type="date"] { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        input[type="text"] { flex: 1; }
        button { padding: 10px 18px; background-color: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #219150; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #0d2b45; color: white; }
        .btn-status { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-present { background-color: #2ecc71; color: white; }
        .btn-absent { background-color: #e74c3c; color: white; }
        .btn-delete { background-color: #c0392b; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-present { background-color: #d4edda; color: #155724; }
        .badge-absent { background-color: #f8d7da; color: #721c24; }
        .badge-none { background-color: #e2e3e5; color: #383d41; }
        .stats-cards { display: flex; gap: 15px; margin-bottom: 20px; }
        .card { flex: 1; padding: 15px; background: #ecf0f1; border-radius: 8px; text-align: center; }
        .card h3 { font-size: 24px; color: #0d2b45; }
        .card p { color: #7f8c8d; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="school-header">
        <svg class="school-logo-svg" viewBox="0 0 300 300">
            <path d="M 30,200 A 120,120 0 0,1 270,200 L 240,200 A 90,90 0 0,0 60,200 Z" fill="#0d2b45" stroke="#d4af37" stroke-width="4"/>
            <path d="M 110,170 Q 150,155 150,180 Q 150,155 190,170 L 190,195 Q 150,180 150,195 Q 150,180 110,195 Z" fill="#ffffff" stroke="#0d2b45" stroke-width="3"/>
            <circle cx="150" cy="140" r="18" fill="#f39c12"/>
            <path d="M 150,110 L 150,118 M 125,120 L 132,126 M 175,120 L 168,126 M 110,140 L 118,140 M 190,140 L 182,140" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>
            <path d="M 20,200 Q 150,230 280,200 L 260,230 Q 150,250 40,230 Z" fill="#0d2b45" stroke="#d4af37" stroke-width="3"/>
            <text x="150" y="222" font-family="Arial" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">إيمان  •  علم  •  تعاون</text>
        </svg>

        <div class="school-info">
            <h1>مدرسة قدري أبو حسين الثانوية العسكرية بنين بأخميم</h1>
            <p>نظام الحضور والغياب المباشر</p>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('attendance-tab', this)">تسجيل الحضور اليومي</button>
        <button class="tab-btn" onclick="switchTab('reports-tab', this)">التقارير والسجل الشامل</button>
    </div>

    <div id="attendance-tab" class="tab-content active">
        <div class="control-panel">
            <div>
                <label><strong>تاريخ اليوم:</strong> </label>
                <input type="date" id="attendanceDate" onchange="renderAttendanceTable()">
            </div>
            
            <div class="form-group">
                <input type="text" id="studentName" placeholder="إضافة اسم طالب جديد...">
                <button onclick="addStudent()">إضافة طالب</button>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن اسم الطالب هنا..." oninput="renderAttendanceTable()">
        </div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>اسم الطالب</th>
                    <th>الحالة للتاريخ المحدد</th>
                    <th>تسجيل الحضور</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="attendanceTableBody"></tbody>
        </table>
    </div>

    <div id="reports-tab" class="tab-content">
        <h2 style="text-align: center; margin-bottom: 15px;">📊 تقارير الحضور والغياب التراكمية</h2>
        <div class="stats-cards">
            <div class="card"><h3 id="totalStudents">0</h3><p>إجمالي الطلاب</p></div>
            <div class="card"><h3 id="totalDays">0</h3><p>إجمالي الأيام المسجلة</p></div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>اسم الطالب</th>
                    <th>أيام الحضور</th>
                    <th>أيام الغياب</th>
                    <th>نسبة الحضور</th>
                </tr>
            </thead>
            <tbody id="reportsTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let students = JSON.parse(localStorage.getItem('students_data')) || [];
    let attendanceRecords = JSON.parse(localStorage.getItem('attendance_records')) || {};

    document.getElementById('attendanceDate').valueAsDate = new Date();

    function saveData() {
        localStorage.setItem('students_data', JSON.stringify(students));
        localStorage.setItem('attendance_records', JSON.stringify(attendanceRecords));
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        if (tabId === 'reports-tab') renderReportsTable();
    }

    function addStudent() {
        const nameInput = document.getElementById('studentName');
        const name = nameInput.value.trim();
        if (!name) return alert('يرجى كتابة اسم الطالب');

        const newStudent = { id: Date.now().toString(), name: name };
        students.push(newStudent);
        saveData();
        nameInput.value = '';
        renderAttendanceTable();
    }

    function deleteStudent(id) {
        if (confirm('هل أنت تأكد من حذف هذا الطالب من جميع السجلات؟')) {
            students = students.filter(s => s.id !== id);
            for (let date in attendanceRecords) {
                if (attendanceRecords[date][id]) delete attendanceRecords[date][id];
            }
            saveData();
            renderAttendanceTable();
        }
    }

    function setStatus(studentId, status) {
        const selectedDate = document.getElementById('attendanceDate').value;
        if (!selectedDate) return alert('يرجى تحديد التاريخ أولاً');
        
        if (!attendanceRecords[selectedDate]) {
            attendanceRecords[selectedDate] = {};
        }
        attendanceRecords[selectedDate][studentId] = status;
        saveData();
        renderAttendanceTable();
    }

    function renderAttendanceTable() {
        const selectedDate = document.getElementById('attendanceDate').value;
        const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
        const tbody = document.getElementById('attendanceTableBody');
        tbody.innerHTML = '';
        const dayRecord = attendanceRecords[selectedDate] || {};

        const filteredStudents = students.filter(student => 
            student.name.toLowerCase().includes(searchQuery)
        );

        if (filteredStudents.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5">لا يوجد طلاب مسجلون</td></tr>';
            return;
        }

        filteredStudents.forEach((student, index) => {
            const status = dayRecord[student.id] || 'لم يسجل';
            let badgeClass = 'badge-none';
            if (status === 'حاضر') badgeClass = 'badge-present';
            if (status === 'غائب') badgeClass = 'badge-absent';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${student.name}</strong></td>
                <td><span class="badge ${badgeClass}">${status}</span></td>
                <td>
                    <button class="btn-status btn-present" onclick="setStatus('${student.id}', 'حاضر')">حاضر</button>
                    <button class="btn-status btn-absent" onclick="setStatus('${student.id}', 'غائب')">غائب</button>
                </td>
                <td><button class="btn-status btn-delete" onclick="deleteStudent('${student.id}')">حذف</button></td>
            `;
            tbody.appendChild(row);
        });
    }

    function renderReportsTable() {
        const tbody = document.getElementById('reportsTableBody');
        tbody.innerHTML = '';
        const dates = Object.keys(attendanceRecords);
        document.getElementById('totalStudents').innerText = students.length;
        document.getElementById('totalDays').innerText = dates.length;

        students.forEach((student, index) => {
            let presentCount = 0, absentCount = 0;
            dates.forEach(date => {
                const status = attendanceRecords[date][student.id];
                if (status === 'حاضر') presentCount++;
                if (status === 'غائب') absentCount++;
            });
            const totalRecordedDays = presentCount + absentCount;
            const attendancePercentage = totalRecordedDays > 0 ? Math.round((presentCount / totalRecordedDays) * 100) + '%' : '0%';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${student.name}</strong></td>
                <td style="color: green; font-weight: bold;">${presentCount} يوم</td>
                <td style="color: red; font-weight: bold;">${absentCount} يوم</td>
                <td><span class="badge badge-present">${attendancePercentage}</span></td>
            `;
            tbody.appendChild(row);
        });
    }

    // التشغيل الأولي
    renderAttendanceTable();
</script>

</body>
</html>
